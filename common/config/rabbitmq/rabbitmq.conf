## allow access to the guest user from anywhere on the network
## https://www.rabbitmq.com/access-control.html#loopback-users
loopback_users.guest = false

## Send all logs to stdout/TTY
log.console = true

## Bind management HTTP listener on all IPv6 interfaces (accepts both IPv4 and
## IPv6). Required on IPv6-only hosts: Docker's ip6tables DNAT routes external
## IPv6 connections directly to the container's IPv6 address, bypassing
## docker-proxy. Without this, the management UI is only reachable via IPv4.
management.tcp.ip = ::
